<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proyectos del curso (Cx4)</title>
</head>

<body>

  <section id="body">
    <h2>Asignación de Ejercicios</h2>
    <button id="body_btNuevoLider">Nuevo líder</button>
    <hr>
    <div>
      Cantidad de equipos con el ejercicio COMENSAL: <span id="body_lblCntComensales">0</span>
    </div>
    <div>
      Porcentaje de equipos con el ejercicio EVENTO: <span id="body_lblPorcEventos">0%</span>
    </div>
    <div>
      Hay más equipos con ejercicio COMENSAL o EVENTO: <span id="body_lblMasComensalesEventos">---</span>
    </div>
  </section>

  <section id="lider" hidden style="margin-top: 20px; border: 1px solid #ccc; padding: 15px; width: 300px;">
    <h5 id="lider_lblTitulo">Procesar Líder</h5>
    <div>
      <label>Nombre:
        <input type="text" id="lider_inNombre" placeholder="Nombre del líder">
      </label>
    </div>
    <div>
      <label>Cédula:
        <input type="number" id="lider_inCedula" placeholder="Ej: 25123456">
      </label>
    </div>
    <div>
      <label>Equipo:
        <input type="text" id="lider_inEquipo" placeholder="Ej: TEAM PLUS">
      </label>
    </div>
    <div>
      <label>Ejercicio 1:
        <select id="lider_inEjercicio1">
          <option value="ACADEMIA">ACADEMIA</option>
          <option value="COMENSAL">COMENSAL</option>
          <option value="CONCURSO">CONCURSO</option>
          <option value="EVENTO">EVENTO</option>
          <option value="MEDICO">MEDICO</option>
        </select>
      </label>
    </div>
    <div>
      <label>Ejercicio 2:
        <select id="lider_inEjercicio2">
          <option value="ACADEMIA">ACADEMIA</option>
          <option value="COMENSAL">COMENSAL</option>
          <option value="CONCURSO">CONCURSO</option>
          <option value="EVENTO">EVENTO</option>
          <option value="MEDICO">MEDICO</option>
        </select>
      </label>
    </div>
    <div>
      <label>Ejercicio 3:
        <select id="lider_inEjercicio3">
          <option value="ACADEMIA">ACADEMIA</option>
          <option value="COMENSAL">COMENSAL</option>
          <option value="CONCURSO">CONCURSO</option>
          <option value="EVENTO">EVENTO</option>
          <option value="MEDICO">MEDICO</option>
        </select>
      </label>
    </div>
    <br>
    <button id="lider_btCancelar">Cancelar</button>
    <button id="lider_btAceptar">Aceptar</button>
  </section>

  <script type="module">
    import cCurso from "./dist/controllers/cCurso.js";
    import cLider from "./dist/controllers/cLider.js";

    import vCurso from "./dist/views/vCurso.js";
    import vLider from "./dist/views/vLider.js";

    // 1. Instanciamos las vistas
    const vistaCurso = new vCurso();
    const vistaLider = new vLider();

    // 2. Inyectamos las vistas en los controladores
    const controladorLider = new cLider(vistaLider);
    new cCurso(vistaCurso, controladorLider);
  </script>
</body>

</html>
